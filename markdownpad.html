<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="MarkdownPad — a complete offline markdown notepad in a single HTML file. No network, no install, no account.">
<title>MarkdownPad — offline markdown notepad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%234a63e7'/%3E%3Cpath d='M4 11.4V5.1l2.3 2.6L8.6 5.1v6.3M10.4 5.1v4.2m0 0l-1.3-1.4m1.3 1.4l1.3-1.4' stroke='white' stroke-width='1.35' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style id="mdpad-style">
/* ============ MDPad — offline markdown notepad ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden}

:root{
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --f-serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --r-lg: 12px;
  --sb-w: 268px;
  --tr: 120ms cubic-bezier(.4,0,.2,1);
}

/* ---- light ---- */
:root, [data-theme="light"]{
  --bg:#fff; --bg-2:#f7f7f9; --bg-3:#eeeef2; --bg-hover:#e9e9ef;
  --border:#e2e2e8; --border-2:#d3d3dc;
  --text:#1b1b1f; --text-2:#63636e; --text-3:#8e8e9a;
  --accent:#4a63e7; --accent-fg:#fff; --accent-soft:#e8ebfd; --accent-text:#3a4fd0;
  --danger:#d0342c; --danger-soft:#fdeceb;
  --ok:#177245;
  --mark:#fff3a3; --mark-fg:#3d3200;
  --sel:#c9d3fb;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -8px rgba(20,20,40,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --code-bg:#f4f4f7; --code-border:#e6e6ec;
  --hl-key:#a626a4; --hl-str:#177245; --hl-com:#8e8e9a; --hl-num:#b25000;
  --hl-fn:#3a4fd0; --hl-type:#b25000; --hl-var:#c1341f; --hl-meta:#63636e;
  --hl-attr:#b25000; --hl-tag:#c1341f; --hl-lit:#a626a4;
}
/* ---- dark ---- */
[data-theme="dark"]{
  --bg:#151519; --bg-2:#1b1b21; --bg-3:#23232b; --bg-hover:#2a2a33;
  --border:#2b2b34; --border-2:#3a3a45;
  --text:#e9e9ee; --text-2:#a0a0ad; --text-3:#77777f;
  --accent:#7b8ff5; --accent-fg:#12121a; --accent-soft:#242a4a; --accent-text:#9fb0ff;
  --danger:#f2726a; --danger-soft:#3a1f1e;
  --ok:#5cc98c;
  --mark:#5d5220; --mark-fg:#ffeaa0;
  --sel:#33407a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -8px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --code-bg:#1d1d24; --code-border:#2b2b34;
  --hl-key:#c792ea; --hl-str:#7ec699; --hl-com:#6d6d78; --hl-num:#f0a05a;
  --hl-fn:#82aaff; --hl-type:#ffcb6b; --hl-var:#f07f7f; --hl-meta:#a0a0ad;
  --hl-attr:#ffcb6b; --hl-tag:#f07f7f; --hl-lit:#c792ea;
}

/* ---- hacker ---- */
[data-theme="hacker"]{
  --f-ui: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --f-serif: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg:#020503; --bg-2:#040905; --bg-3:#0a140c; --bg-hover:#0f1f12;
  --border:#10331a; --border-2:#1a4d27;
  --text:#2bff64; --text-2:#1fca4e; --text-3:#14813a;
  --accent:#2bff64; --accent-fg:#020503; --accent-soft:#0a2f14; --accent-text:#5bff8a;
  --danger:#ff4d4d; --danger-soft:#2e0c0c;
  --ok:#2bff64;
  --mark:#123f1c; --mark-fg:#7dffa4;
  --sel:#0f5c26;
  --shadow:0 0 0 1px #10331a, 0 8px 30px -6px rgba(43,255,100,.18);
  --shadow-sm:0 0 8px -2px rgba(43,255,100,.25);
  --code-bg:#03110700; --code-bg:#031107; --code-border:#10331a;
  --hl-key:#5bff8a; --hl-str:#b6ff7d; --hl-com:#14813a; --hl-num:#8affd1;
  --hl-fn:#7dffa4; --hl-type:#c8ff9e; --hl-var:#5affc3; --hl-meta:#1fca4e;
  --hl-attr:#c8ff9e; --hl-tag:#5affc3; --hl-lit:#8affd1;
}
[data-theme="hacker"] body{text-shadow:0 0 6px rgba(43,255,100,.22)}
[data-theme="hacker"] #editor{caret-color:#2bff64;text-shadow:0 0 6px rgba(43,255,100,.22)}
[data-theme="hacker"] .md-body h1,[data-theme="hacker"] .md-body h2,[data-theme="hacker"] .brand{
  text-shadow:0 0 10px rgba(43,255,100,.45)}
[data-theme="hacker"] .md-body h1::before{content:"> "}
[data-theme="hacker"] .md-body h2::before{content:">> "}
[data-theme="hacker"] .brand small{color:var(--text-3)}
[data-theme="hacker"] .btn.primary{box-shadow:0 0 14px -2px rgba(43,255,100,.6)}
[data-theme="hacker"] img{filter:sepia(1) hue-rotate(70deg) saturate(2.2) brightness(.9)}
[data-theme="hacker"] #app::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:998;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
[data-theme="hacker"] .toast{background:#0a2f14;color:#5bff8a;border:1px solid #1a4d27;text-shadow:none}
[data-theme="hacker"] .toast button{color:#b6ff7d}
[data-theme="hacker"] ::selection{background:#0f5c26;color:#d7ffe2}

body{
  font-family:var(--f-ui); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent-text)}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:3px solid transparent}

/* ============ shell ============ */
#app{display:flex;flex-direction:column;height:100dvh}
.topbar{
  display:flex;align-items:center;gap:8px;height:44px;flex:0 0 44px;
  padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--border);
  -webkit-user-select:none;user-select:none;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:650;letter-spacing:-.01em;padding:0 6px 0 2px}
.brand svg{color:var(--accent)}
.brand small{font-weight:450;color:var(--text-3);font-size:11px;letter-spacing:0}
.spacer{flex:1}
.doc-title{
  font-weight:560;font-size:13.5px;padding:4px 8px;border-radius:var(--r-sm);
  border:1px solid transparent;background:transparent;min-width:60px;max-width:420px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
}
.doc-title:hover{background:var(--bg-3)}
.doc-title:focus{outline:none;background:var(--bg);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 9px;border-radius:var(--r-sm);color:var(--text-2);
  transition:background var(--tr),color var(--tr);white-space:nowrap;
}
.btn:hover{background:var(--bg-3);color:var(--text)}
.btn:active{background:var(--bg-hover)}
.btn.icon{width:30px;padding:0}
.btn.on{background:var(--accent-soft);color:var(--accent-text)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-fg)}
.btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{flex:0 0 auto}

.seg{display:flex;background:var(--bg-3);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg .btn{height:26px;border-radius:4px}
.seg .btn.on{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .seg .btn.on{background:var(--bg-hover);color:var(--text)}

.main{display:flex;flex:1;min-height:0}

/* ============ sidebar ============ */
.sidebar{
  width:var(--sb-w);flex:0 0 var(--sb-w);display:flex;flex-direction:column;
  background:var(--bg-2);border-right:1px solid var(--border);min-height:0;
}
body.no-sidebar .sidebar{display:none}
.sb-tabs{display:flex;gap:2px;padding:8px 8px 0}
.sb-tab{
  flex:1;height:28px;border-radius:var(--r-sm);font-size:12.5px;font-weight:550;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:var(--tr);
}
.sb-tab:hover{background:var(--bg-3);color:var(--text-2)}
.sb-tab.on{background:var(--bg-3);color:var(--text)}
.sb-search{padding:8px;position:relative}
.sb-search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.sb-search input{
  width:100%;height:30px;padding:0 26px 0 28px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);outline:none;font-size:13px;
}
.sb-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sb-search .clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:4px;display:none;align-items:center;justify-content:center;color:var(--text-3)}
.sb-search .clear:hover{background:var(--bg-3);color:var(--text)}
.sb-search.has-val .clear{display:flex}

.sb-toolbar{display:flex;align-items:center;gap:4px;padding:0 8px 8px}
.sb-toolbar .btn{height:28px;font-size:12.5px}
.sb-toolbar select{
  height:28px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--border);
  font-size:12px;color:var(--text-2);padding:0 4px;outline:none;max-width:112px;
}
.sb-body{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}

.note-item{
  display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r);
  margin-bottom:2px;border:1px solid transparent;transition:background var(--tr);position:relative;
}
.note-item:hover{background:var(--bg-3)}
.note-item.on{background:var(--bg);border-color:var(--border);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .note-item.on{background:var(--bg-hover);border-color:var(--border-2)}
.note-item h4{margin:0;font-size:13px;font-weight:560;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;padding-right:16px}
.note-item p{margin:2px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-item .meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:var(--text-3)}
.note-item .pin{position:absolute;top:7px;right:8px;color:var(--text-3);opacity:0;transition:var(--tr);
  width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.note-item:hover .pin,.note-item .pin.on{opacity:1}
.note-item .pin.on{color:var(--accent)}
.note-item .pin:hover{background:var(--bg-hover);color:var(--text)}
.tagchip{display:inline-block;padding:0 5px;height:15px;line-height:15px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent-text);font-size:10px;font-weight:550}
.sb-group{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-3);padding:10px 10px 5px}
.empty{padding:28px 16px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.6}

/* outline */
.outline a{display:block;padding:4px 8px;border-radius:var(--r-sm);color:var(--text-2);
  font-size:12.5px;text-decoration:none;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline a:hover{background:var(--bg-3);color:var(--text)}
.outline a.active{background:var(--accent-soft);color:var(--accent-text);font-weight:560}
.outline a.h1{font-weight:600;color:var(--text)}
.outline a.h2{padding-left:18px}
.outline a.h3{padding-left:30px;font-size:12px}
.outline a.h4{padding-left:42px;font-size:12px}
.outline a.h5{padding-left:54px;font-size:11.5px}
.outline a.h6{padding-left:66px;font-size:11.5px}

/* ============ panes ============ */
.panes{flex:1;display:flex;min-width:0;position:relative}
.pane{display:flex;flex-direction:column;min-width:0;flex:1 1 50%;position:relative}
.gutter{flex:0 0 5px;cursor:col-resize;background:var(--border);opacity:.55;transition:opacity var(--tr)}
.gutter:hover,.gutter.dragging{opacity:1;background:var(--accent)}
body.view-edit .pane-preview,body.view-edit .gutter{display:none}
body.view-edit .pane-edit{flex-basis:100%}
body.view-prev .pane-edit,body.view-prev .gutter{display:none}
body.view-prev .pane-preview{flex-basis:100%}

/* editor */
.mdtoolbar{
  display:flex;align-items:center;gap:1px;padding:5px 8px;flex:0 0 auto;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:var(--bg-2);
}
.mdtoolbar .btn{height:26px;width:26px;color:var(--text-3)}
.mdtoolbar .btn:hover{color:var(--text)}
.mdtoolbar .sep{width:1px;height:16px;background:var(--border);margin:0 5px}
body.no-toolbar .mdtoolbar{display:none}

.editor-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#editor{
  position:absolute;inset:0;width:100%;height:100%;resize:none;border:none;outline:none;
  background:var(--bg);color:var(--text);padding:24px 28px 45vh;
  font-family:var(--f-mono);font-size:14px;line-height:1.7;tab-size:2;
  overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;
}
#editor::placeholder{color:var(--text-3)}
body.ed-sans #editor{font-family:var(--f-ui);line-height:1.75}
body.ed-serif #editor{font-family:var(--f-serif);font-size:15.5px;line-height:1.8}
body.focus-mode #editor{color:var(--text-3)}
body.typewriter #editor{padding-bottom:50vh;padding-top:35vh}

/* preview */
.pane-preview{background:var(--bg);border-left:1px solid var(--border)}
body.view-prev .pane-preview{border-left:none}
.preview-head{display:flex;align-items:center;gap:4px;padding:5px 8px;flex:0 0 auto;
  border-bottom:1px solid var(--border);background:var(--bg-2);min-height:37px}
.preview-head .lbl{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding-left:4px}
#preview{flex:1;overflow-y:auto;padding:28px 36px 45vh}
.md-body{max-width:var(--prose-w,760px);margin:0 auto;font-size:15px;line-height:1.7;word-wrap:break-word}

/* ============ markdown typography ============ */
.md-body>*:first-child{margin-top:0}
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6{
  margin:1.6em 0 .6em;line-height:1.28;font-weight:650;letter-spacing:-.011em;scroll-margin-top:12px}
.md-body h1{font-size:1.85em;letter-spacing:-.02em}
.md-body h2{font-size:1.42em;padding-bottom:.28em;border-bottom:1px solid var(--border)}
.md-body h3{font-size:1.19em}
.md-body h4{font-size:1.03em}
.md-body h5{font-size:.93em;color:var(--text-2)}
.md-body h6{font-size:.86em;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.md-body p{margin:0 0 1em}
.md-body a{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.md-body a:hover{border-bottom-color:var(--accent)}
.md-body strong{font-weight:660}
.md-body ul,.md-body ol{margin:0 0 1em;padding-left:1.55em}
.md-body li{margin:.28em 0}
.md-body li>ul,.md-body li>ol{margin:.3em 0}
.md-body li::marker{color:var(--text-3)}
.md-body blockquote{
  margin:0 0 1em;padding:.1em 0 .1em 1.05em;border-left:3px solid var(--border-2);color:var(--text-2)}
.md-body blockquote>*:last-child{margin-bottom:0}
.md-body hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.md-body img{max-width:100%;border-radius:var(--r);display:block}
.md-body kbd{font-family:var(--f-mono);font-size:.82em;padding:.15em .45em;border-radius:5px;
  background:var(--bg-3);border:1px solid var(--border-2);border-bottom-width:2px}
.md-body mark{background:var(--mark);color:var(--mark-fg);padding:.08em .2em;border-radius:3px}
.md-body sup{font-size:.75em}
.md-body table{border-collapse:collapse;width:100%;margin:0 0 1.2em;font-size:.93em;display:block;overflow-x:auto}
.md-body th,.md-body td{border:1px solid var(--border);padding:7px 11px;text-align:left}
.md-body th{background:var(--bg-2);font-weight:620}
.md-body tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg-2) 55%,transparent)}
.md-body code{font-family:var(--f-mono);font-size:.87em;background:var(--code-bg);
  border:1px solid var(--code-border);padding:.12em .35em;border-radius:5px}
.md-body pre{margin:0 0 1.2em;background:var(--code-bg);border:1px solid var(--code-border);
  border-radius:var(--r);overflow:hidden;position:relative}
.md-body pre code{display:block;padding:14px 16px;overflow-x:auto;background:none;border:none;
  font-size:.855em;line-height:1.62;border-radius:0}
.md-body pre .codebar{display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px 5px 13px;border-bottom:1px solid var(--code-border);background:color-mix(in srgb,var(--bg-3) 60%,transparent)}
.md-body pre .codebar span{font-size:10.5px;font-weight:620;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.md-body pre .codebar button{font-size:11px;color:var(--text-3);padding:2px 7px;border-radius:5px}
.md-body pre .codebar button:hover{background:var(--bg-hover);color:var(--text)}
.md-body .task-list-item{list-style:none;margin-left:-1.4em}
.md-body .task-list-item input{margin-right:.5em;cursor:pointer;width:14px;height:14px;
  vertical-align:-2px;accent-color:var(--accent)}
.md-body .task-list-item.done{color:var(--text-3)}
.md-body .anchor{opacity:0;margin-left:.35em;font-size:.7em;text-decoration:none;border:none;color:var(--text-3)}
.md-body h1:hover .anchor,.md-body h2:hover .anchor,.md-body h3:hover .anchor,
.md-body h4:hover .anchor,.md-body h5:hover .anchor,.md-body h6:hover .anchor{opacity:1}
.md-body .footnotes{margin-top:2.5em;padding-top:1em;border-top:1px solid var(--border);font-size:.9em;color:var(--text-2)}
.md-body .frontmatter{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 14px;margin:0 0 1.4em;font-size:.85em;color:var(--text-2)}
.md-body .frontmatter dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.md-body .frontmatter dt{font-weight:620;color:var(--text-3)}
.md-body .frontmatter dd{margin:0}
.md-body .search-hit{background:var(--mark);color:var(--mark-fg);border-radius:2px}

/* hljs tokens */
.hljs-keyword,.hljs-selector-tag,.hljs-doctag,.hljs-section{color:var(--hl-key)}
.hljs-string,.hljs-addition,.hljs-char.escape,.hljs-regexp{color:var(--hl-str)}
.hljs-comment,.hljs-quote{color:var(--hl-com);font-style:italic}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--hl-num)}
.hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-name{color:var(--hl-fn)}
.hljs-type,.hljs-built_in,.hljs-class .hljs-title{color:var(--hl-type)}
.hljs-variable,.hljs-template-variable,.hljs-deletion,.hljs-selector-id{color:var(--hl-var)}
.hljs-meta,.hljs-comment .hljs-doctag{color:var(--hl-meta)}
.hljs-attr,.hljs-attribute,.hljs-property,.hljs-selector-class,.hljs-selector-attr{color:var(--hl-attr)}
.hljs-tag{color:var(--hl-tag)}
.hljs-literal,.hljs-operator{color:var(--hl-lit)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
.hljs-link{text-decoration:underline}

/* ============ statusbar ============ */
.statusbar{
  display:flex;align-items:center;gap:14px;height:26px;flex:0 0 26px;padding:0 12px;
  background:var(--bg-2);border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text-3);-webkit-user-select:none;user-select:none;
}
.statusbar b{font-weight:600;color:var(--text-2)}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.statusbar .dot.dirty{background:var(--text-3)}
.statusbar button:hover{color:var(--text)}

/* ============ find bar ============ */
.findbar{
  position:absolute;top:8px;right:16px;z-index:30;display:none;gap:4px;align-items:center;
  background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:6px;flex-wrap:wrap;max-width:calc(100% - 32px);
}
.findbar.on{display:flex}
.findbar input{
  height:28px;padding:0 8px;border-radius:var(--r-sm);background:var(--bg-2);
  border:1px solid var(--border);outline:none;font-size:12.5px;width:150px}
.findbar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.findbar .btn{height:26px;width:26px}
.findbar .count{font-size:11.5px;color:var(--text-3);padding:0 4px;min-width:56px;text-align:center}
.findbar .tog{height:26px;padding:0 7px;font-size:11.5px;font-weight:620;border-radius:var(--r-sm);color:var(--text-3)}
.findbar .tog.on{background:var(--accent-soft);color:var(--accent-text)}

/* ============ modal ============ */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.42);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:8vh 16px;backdrop-filter:blur(2px)}
.scrim.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow);width:100%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:720px}
.modal header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal header h3{margin:0;font-size:14.5px;font-weight:620}
.modal .body{padding:16px;overflow-y:auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg-2)}

/* command palette */
.palette input{width:100%;height:44px;padding:0 16px;border:none;outline:none;background:transparent;font-size:15px}
.palette .list{max-height:52vh;overflow-y:auto;padding:6px;border-top:1px solid var(--border)}
.palette .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px}
.palette .row .k{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--f-mono)}
.palette .row .grp{font-size:11px;color:var(--text-3)}
.palette .row.sel{background:var(--accent-soft);color:var(--accent-text)}
.palette .row.sel .k,.palette .row.sel .grp{color:var(--accent-text);opacity:.75}

/* settings + help */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:none}
.setrow label{font-size:13px;font-weight:520}
.setrow .hint{font-size:11.5px;color:var(--text-3);font-weight:400;margin-top:1px}
.setrow select,.setrow input[type=number]{height:30px;border-radius:var(--r-sm);background:var(--bg-2);
  border:1px solid var(--border);padding:0 8px;outline:none;font-size:13px;min-width:120px}
.switch{width:38px;height:22px;border-radius:11px;background:var(--border-2);position:relative;transition:var(--tr);flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:var(--tr);box-shadow:var(--shadow-sm)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.kbdgrid{display:grid;grid-template-columns:1fr auto;gap:7px 20px;font-size:13px;align-items:center}
.kbdgrid .sec{grid-column:1/-1;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-3);margin-top:12px}
.kbdgrid .sec:first-child{margin-top:0}
.kbdgrid kbd{justify-self:end;font-family:var(--f-mono);font-size:11.5px;padding:2px .45em;border-radius:5px;
  background:var(--bg-3);border:1px solid var(--border-2);border-bottom-width:2px;white-space:nowrap}

/* toast */
.toasts{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:var(--r);
  box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:12px;pointer-events:auto;
  animation:pop .16s cubic-bezier(.2,.8,.3,1)}
.toast button{color:var(--accent);font-weight:620;font-size:13px}
[data-theme="dark"] .toast button{color:var(--accent-text)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

/* drop overlay */
.dropzone{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 12%,rgba(10,10,20,.4));backdrop-filter:blur(3px)}
.dropzone.on{display:flex}
.dropzone div{background:var(--bg);border:2px dashed var(--accent);border-radius:var(--r-lg);
  padding:36px 52px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}

/* dropdown menu */
.menuwrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:60;display:none;min-width:238px;
  background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:5px;
}
.menu.on{display:block}
.menu button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;
  border-radius:var(--r-sm);font-size:13px;color:var(--text);transition:background var(--tr);
}
.menu button:hover{background:var(--bg-3)}
.menu button svg{flex:0 0 auto;color:var(--text-3)}
.menu button span{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--f-mono)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
.sb-backdrop{position:fixed;inset:0;z-index:35;background:rgba(10,10,20,.35);display:none}
body.sb-overlay:not(.no-sidebar) .sb-backdrop{display:block}

/* responsive */
@media (max-width:900px){
  :root{--sb-w:220px}
  .panes{flex-direction:column}
  .gutter{flex:0 0 5px;cursor:row-resize;width:auto}
  .pane-preview{border-left:none;border-top:1px solid var(--border)}
  .brand small{display:none}
}
@media (max-width:720px){
  .sidebar{position:fixed;z-index:40;top:44px;bottom:26px;left:0;width:min(84vw,300px);
    flex-basis:auto;box-shadow:var(--shadow)}
  body.no-sidebar .sidebar{display:none}
  .brand{display:none}
  .doc-title{max-width:none;flex:1 1 auto;min-width:0;text-align:left}
  .topbar .spacer{display:none}
  .topbar{gap:4px;padding:0 6px}
  #btn-settings,#btn-find{display:none}
  .statusbar{gap:10px;font-size:11px}
  #st-read,#st-cursor,#st-notes{display:none}
  .mdtoolbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .mdtoolbar::-webkit-scrollbar{display:none}
  #editor{padding:18px 16px 45vh}
  #preview{padding:20px 18px 45vh}
  .preview-head #btn-copy-md span,.menu{font-size:12.5px}
  .findbar{right:8px;left:8px;max-width:none}
  .findbar input{flex:1 1 110px;width:auto;min-width:0}
  .modal{max-height:86vh}
}
@media (max-width:359px){
  #btn-theme{display:none}
  .sb-toolbar select{max-width:88px}
}

/* accessibility */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#editor:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* empty preview hint */
#md-body:empty::after{
  content:"Nothing to preview yet — start typing on the left.";
  display:block;color:var(--text-3);font-size:14px;font-style:italic;
}

/* print */
@page{
  margin:17mm 15mm 20mm;
  @top-left{content:none}
  @top-center{content:none}
  @top-right{content:none}
  @bottom-left{content:none}
  @bottom-right{content:none}
  @bottom-center{
    content:counter(page);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:9pt;color:#8e8e9a;
  }
}
@media print{
  :root,[data-theme="dark"],[data-theme="hacker"]{
    --bg:#fff;--bg-2:#f7f7f9;--bg-3:#eeeef2;--border:#ddd;--border-2:#ccc;
    --text:#111;--text-2:#555;--text-3:#888;--accent-text:#333;
    --code-bg:#f4f4f7;--code-border:#e6e6ec;--mark:#fff3a3;--mark-fg:#3d3200;
    --hl-key:#7a2f98;--hl-str:#136f3f;--hl-com:#777;--hl-num:#9c4a00;
    --hl-fn:#2c3fa8;--hl-type:#9c4a00;--hl-var:#a02c18;--hl-meta:#555;
    --hl-attr:#9c4a00;--hl-tag:#a02c18;--hl-lit:#7a2f98;
  }
  body,#editor,.md-body h1,.md-body h2{text-shadow:none!important}
  [data-theme="hacker"] #app::after{display:none}
  [data-theme="hacker"] .md-body h1::before,[data-theme="hacker"] .md-body h2::before{content:none}
  [data-theme="hacker"] img{filter:none}
  body{overflow:visible;background:#fff}
  .topbar,.sidebar,.statusbar,.mdtoolbar,.preview-head,.gutter,.pane-edit,.findbar,.toasts{display:none!important}
  #app,.main,.panes,.pane{display:block;height:auto;overflow:visible}
  #preview{overflow:visible;padding:0;height:auto}
  .md-body{max-width:none;font-size:11.5pt}
  .md-body pre,.md-body blockquote,.md-body table{page-break-inside:avoid}
  .md-body h1,.md-body h2,.md-body h3{page-break-after:avoid}
  .md-body pre .codebar{display:none}
  .md-body a{color:#000;border:none}
}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="btn icon" id="btn-sidebar" title="Toggle sidebar (Ctrl/⌘+\)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6.25 2.75v10.5"/></svg>
    </button>
    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13.5V4.2c0-.9.7-1.7 1.6-1.7h5L13.5 7v6.5c0 .6-.4 1-1 1h-9c-.6 0-1-.4-1-1z"/><path d="M9 2.6V7h4.4"/><path d="M5.4 10.6l1.3-1.3 1.2 1.2 2.2-2.2"/></svg>
      MarkdownPad <small>offline</small>
    </div>
    <div class="spacer"></div>
    <input class="doc-title" id="doc-title" spellcheck="false" placeholder="Untitled">
    <div class="spacer"></div>
    <div class="seg" id="view-seg">
      <button class="btn" data-view="edit" title="Editor only (Ctrl/⌘+1)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.3 2.9l1.8 1.8-7.4 7.4-2.4.6.6-2.4z"/><path d="M2.5 14.2h11"/></svg>
      </button>
      <button class="btn" data-view="split" title="Split (Ctrl/⌘+2)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M8 2.75v10.5"/></svg>
      </button>
      <button class="btn" data-view="prev" title="Preview only (Ctrl/⌘+3)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1.3 8S3.6 3.6 8 3.6 14.7 8 14.7 8 12.4 12.4 8 12.4 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="1.9"/></svg>
      </button>
    </div>
    <div class="seg" style="background:none;padding:0">
      <button class="btn icon" id="btn-find" title="Find &amp; replace (Ctrl/⌘+F)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2l3.3 3.3"/></svg>
      </button>
      <button class="btn icon" id="btn-palette" title="Command palette (Ctrl/⌘+K)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l1.7 3.9 4.2.4-3.2 2.8 1 4.1L8 10.9l-3.7 2.1 1-4.1L2.1 6.1l4.2-.4z"/></svg>
      </button>
      <button class="btn icon" id="btn-theme" title="Toggle theme (Ctrl/⌘+Shift+L)"></button>
      <button class="btn icon" id="btn-settings" title="Settings">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.1"/><path d="M12.9 9.8a1.1 1.1 0 00.22 1.21l.04.04a1.33 1.33 0 11-1.88 1.88l-.04-.04a1.1 1.1 0 00-1.21-.22 1.1 1.1 0 00-.67 1v.11a1.33 1.33 0 11-2.66 0v-.06a1.1 1.1 0 00-.72-1 1.1 1.1 0 00-1.21.22l-.04.04A1.33 1.33 0 112.85 11.1l.04-.04a1.1 1.1 0 00.22-1.21 1.1 1.1 0 00-1-.67h-.11a1.33 1.33 0 110-2.66h.06a1.1 1.1 0 001-.72 1.1 1.1 0 00-.22-1.21l-.04-.04A1.33 1.33 0 114.68 2.67l.04.04a1.1 1.1 0 001.21.22h.05a1.1 1.1 0 00.67-1v-.11a1.33 1.33 0 112.66 0v.06a1.1 1.1 0 00.67 1 1.1 1.1 0 001.21-.22l.04-.04a1.33 1.33 0 111.88 1.88l-.04.04a1.1 1.1 0 00-.22 1.21v.05a1.1 1.1 0 001 .67h.11a1.33 1.33 0 010 2.66h-.06a1.1 1.1 0 00-1 .67z"/></svg>
      </button>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="sb-tabs">
        <button class="sb-tab on" data-tab="notes">Notes</button>
        <button class="sb-tab" data-tab="outline">Outline</button>
      </div>
      <div class="sb-search" id="sb-search-wrap">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2l3.3 3.3"/></svg>
        <input id="sb-search" placeholder="Search notes…" spellcheck="false">
        <button class="clear" id="sb-search-clear" title="Clear">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
        </button>
      </div>
      <div class="sb-toolbar" id="sb-toolbar">
        <button class="btn primary" id="btn-new" style="flex:1" title="New note (Alt+N)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>New
        </button>
        <select id="sort-sel" title="Sort notes">
          <option value="updated">Recent</option>
          <option value="created">Created</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
      <div class="sb-body" id="sb-body" role="listbox" aria-label="Notes"></div>
    </aside>

    <div class="panes" id="panes">
      <section class="pane pane-edit">
        <div class="mdtoolbar" id="mdtoolbar"></div>
        <div class="editor-wrap">
          <textarea id="editor" spellcheck="true" placeholder="# Start writing…&#10;&#10;Markdown supported — **bold**, *italic*, `code`, tables, task lists, footnotes and ==highlights==."></textarea>
          <div class="findbar" id="findbar">
            <input id="find-in" placeholder="Find" spellcheck="false">
            <span class="count" id="find-count">0/0</span>
            <button class="btn icon" id="find-prev" title="Previous (Shift+Enter)">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg></button>
            <button class="btn icon" id="find-next" title="Next (Enter)">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
            <button class="tog" id="find-case" title="Match case">Aa</button>
            <button class="tog" id="find-word" title="Whole word">W</button>
            <button class="tog" id="find-re" title="Regular expression">.*</button>
            <span style="width:100%;height:0"></span>
            <input id="rep-in" placeholder="Replace" spellcheck="false">
            <button class="btn" id="rep-one" style="font-size:12px;padding:0 8px">Replace</button>
            <button class="btn" id="rep-all" style="font-size:12px;padding:0 8px">All</button>
            <button class="btn icon" id="find-close" title="Close (Esc)">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
          </div>
        </div>
      </section>

      <div class="gutter" id="gutter"></div>

      <section class="pane pane-preview">
        <div class="preview-head">
          <span class="lbl">Preview</span>
          <div class="spacer"></div>
          <button class="btn" id="btn-copy-md" title="Copy the markdown source" style="font-size:12px">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.4" y="5.4" width="8.4" height="8.4" rx="1.6"/><path d="M10.6 5.4V3.8c0-.9-.7-1.6-1.6-1.6H3.8c-.9 0-1.6.7-1.6 1.6v5.2c0 .9.7 1.6 1.6 1.6h1.6"/></svg>Copy
          </button>
          <div class="menuwrap">
            <button class="btn" id="btn-export" title="Save or export this note" style="font-size:12px">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.4v7.2"/><path d="M5.2 7.1L8 9.9l2.8-2.8"/><path d="M2.6 11.2v1.1c0 .8.6 1.4 1.4 1.4h8c.8 0 1.4-.6 1.4-1.4v-1.1"/></svg>Save
              <svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6"><path d="M4 6.5l4 4 4-4"/></svg>
            </button>
            <div class="menu" id="export-menu">
              <button data-act="md"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.4 13.6V2.4h5.4L12.6 6v7.6z"/><path d="M8.6 2.5V6h3.9"/></svg>Save as Markdown<span>.md</span></button>
              <button data-act="html"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 5.4L3.2 8l2.6 2.6M10.2 5.4L12.8 8l-2.6 2.6"/></svg>Export styled page<span>.html</span></button>
              <button data-act="pdf"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 6V2.2h7V6"/><rect x="2" y="6" width="12" height="5" rx="1.3"/><path d="M4.5 9.5h7v4.3h-7z"/></svg>Print / Save as PDF<span>&#8984;P</span></button>
              <div class="sep"></div>
              <button data-act="cmd"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.4" y="5.4" width="8.4" height="8.4" rx="1.6"/><path d="M10.6 5.4V3.8c0-.9-.7-1.6-1.6-1.6H3.8c-.9 0-1.6.7-1.6 1.6v5.2c0 .9.7 1.6 1.6 1.6h1.6"/></svg>Copy rendered HTML</button>
              <div class="sep"></div>
              <button data-act="backup"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><ellipse cx="8" cy="4" rx="5.4" ry="1.9"/><path d="M2.6 4v8c0 1 2.4 1.9 5.4 1.9s5.4-.9 5.4-1.9V4"/><path d="M2.6 8c0 1 2.4 1.9 5.4 1.9s5.4-.9 5.4-1.9"/></svg>Back up all notes<span>.json</span></button>

    <span id="st-read"></span>
    <div class="spacer"></div>
    <span id="st-cursor"></span>
    <span id="st-notes"></span>

    <div class="body" id="settings-body"></div>

      <div class="spacer"></div>
      <button class="btn" id="btn-export-all">Export backup</button>
      <button class="btn primary" id="btn-import-all">Import backup</button>
    </footer>
  </div>
</div>

<div class="scrim" id="scrim-help">
  <div class="modal wide">
    <header><h3>Keyboard shortcuts &amp; markdown reference</h3><div class="spacer"></div><button class="btn icon" data-close>✕</button></header>
    <div class="body" id="help-body"></div>
  </div>
</div>

    '<div class="sec" style="font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin:22px 0 8px">Markdown supported</div>' +
    '<div class="md-body" style="font-size:13.5px;max-width:none">' + renderMarkdown(CHEATSHEET) + '</div>';
}
function openModal(id) { closeModals(); $('#' + id).classList.add('on'); }
function closeModals() { $$('.scrim').forEach(function (s) { s.classList.remove('on'); }); }

/* ---------------- task checkbox write-back ---------------- */
function toggleTask(index) {
  var n = active(), lines = (n.body || '').split('\n'), count = -1, inFence = false;
  for (var i = 0; i < lines.length; i++) {
    if (/^\s*(```|~~~)/.test(lines[i])) { inFence = !inFence; continue; }
    if (inFence) continue;
    var m = /^(\s*(?:[-*+]|\d+[.)])\s+\[)([ xX])(\]\s?)/.exec(lines[i]);
    if (!m) continue;
    count++;
    if (count === index) {
      var on = m[2].toLowerCase() === 'x';
      lines[i] = m[1] + (on ? ' ' : 'x') + m[3] + lines[i].slice(m[0].length);
      var start = lines.slice(0, i).reduce(function (a, l) { return a + l.length + 1; }, 0);
      var e = ed(), keep = e.selectionStart, top = e.scrollTop, ptop = els.preview.scrollTop;
      replaceRange(start, start + (m[0].length), m[1] + (on ? ' ' : 'x') + m[3]);
      e.setSelectionRange(keep, keep); e.scrollTop = top;
      renderPreview(); els.preview.scrollTop = ptop;
      return;
    }
  }
}

function markActiveHeading() {
  if (S.settings.tab !== 'outline' || !S.settings.showSidebar) return;
  var hs = $$('#md-body h1, #md-body h2, #md-body h3, #md-body h4, #md-body h5, #md-body h6');
  var top = els.preview.getBoundingClientRect().top + 8, cur = null;
  for (var i = 0; i < hs.length; i++) { if (hs[i].getBoundingClientRect().top <= top + 40) cur = hs[i]; else break; }
  $$('.outline a').forEach(function (a) {
    a.classList.toggle('active', !!cur && a.getAttribute('href') === '#' + cur.id);
  });
}

/* ---------------- scroll sync ---------------- */
var syncLock = 0;
function syncFrom(src, dst) {
  if (!S.settings.syncScroll || S.settings.view !== 'split') return;
  if (Date.now() < syncLock) return;
  var max = src.scrollHeight - src.clientHeight;
  if (max <= 0) return;
  syncLock = Date.now() + 60;
  var r = src.scrollTop / max;
  dst.scrollTop = r * (dst.scrollHeight - dst.clientHeight);
}

/* ---------------- events ---------------- */
function wire() {
  var e = els.editor;

  e.addEventListener('input', function () { touch(); renderPreviewDebounced(); updateStatus(); if (findState.on) runFind(true); });
  e.addEventListener('scroll', function () { syncFrom(e, els.preview); });
  els.preview.addEventListener('scroll', function () { syncFrom(els.preview, e); markActiveHeading(); });
  ['keyup', 'click', 'select'].forEach(function (ev) { e.addEventListener(ev, updateCursor); });

  e.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.metaKey && !ev.ctrlKey) { if (handleEnter(ev)) return; }
    if (ev.key === 'Tab') { handleTab(ev); return; }
    if (!ev.metaKey && !ev.ctrlKey && !ev.altKey && handlePair(ev)) return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
      ev.preventDefault(); moveLines(ev.key === 'ArrowUp' ? -1 : 1); return;
    }
  });

  /* paste: images become embedded attachments; a URL over a selection becomes a link */
  e.addEventListener('paste', function (ev) {
    var cd = ev.clipboardData || window.clipboardData;
    if (cd && cd.items) {
      for (var i = 0; i < cd.items.length; i++) {
        if (cd.items[i].kind === 'file' && /^image\//.test(cd.items[i].type)) {
          ev.preventDefault();
          var f = cd.items[i].getAsFile();
          if (f) embedImageFile(f);
          return;
        }
      }
    }
    var txt = cd.getData('text');
    var sel = e.value.slice(e.selectionStart, e.selectionEnd);
    if (txt && sel && /^https?:\/\/\S+$/i.test(txt.trim())) {
      ev.preventDefault();
      var s = e.selectionStart;
      var out = '[' + sel + '](' + txt.trim() + ')';
      replaceRange(s, e.selectionEnd, out, s + out.length);
    }
  });

  /* title */
  els['doc-title'].addEventListener('input', function () {
    var n = active(); n.title = els['doc-title'].value; n.updated = Date.now();
    renderSidebar(); setSaved(false); save();
  });
  els['doc-title'].addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); e.focus(); } });

  /* sidebar */
  els['sb-body'].addEventListener('click', function (ev) {
    var pin = ev.target.closest('[data-pin]');
    var item = ev.target.closest('.note-item');
    if (pin && item) {
      ev.stopPropagation();
      var n = S.notes.find(function (x) { return x.id === item.dataset.id; });
      n.pinned = !n.pinned; renderSidebar(); saveNow(); return;
    }
    if (item) {
      openNote(item.dataset.id, true);
      if (window.innerWidth <= 720) setSetting('showSidebar', false);
      return;
    }
    var a = ev.target.closest('a[data-line]');
    if (a) {
      ev.preventDefault();
      var line = +a.dataset.line;
      var pos = e.value.split('\n').slice(0, line).reduce(function (acc, l) { return acc + l.length + 1; }, 0);
      e.focus(); e.setSelectionRange(pos, pos); scrollCaretIntoView();
      var h = document.getElementById(a.getAttribute('href').slice(1));
      if (h) { syncLock = Date.now() + 400; h.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    }
  });
  els['sb-body'].addEventListener('contextmenu', function (ev) {
    var item = ev.target.closest('.note-item'); if (!item) return;
    ev.preventDefault(); openNote(item.dataset.id, false);
    openPalette();
  });
  $$('.sb-tab').forEach(function (b) { b.onclick = function () { setSetting('tab', b.dataset.tab); }; });
  els['sb-search'].addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown' || ev.key === 'Enter') {
      var first = els['sb-body'].querySelector('.note-item');
      if (first) { ev.preventDefault(); first.focus(); }
    }
  });
  els['sb-body'].addEventListener('keydown', function (ev) {
    var item = ev.target.closest('.note-item'); if (!item) return;
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openNote(item.dataset.id, true); return; }
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    ev.preventDefault();
    var all = $$('.note-item', els['sb-body']), i = all.indexOf(item);
    var next = all[i + (ev.key === 'ArrowDown' ? 1 : -1)];
    if (next) { next.focus(); openNote(next.dataset.id, false); }
    else if (ev.key === 'ArrowUp') els['sb-search'].focus();
  });
  els['sb-search'].addEventListener('input', function () {
    $('#sb-search-wrap').classList.toggle('has-val', !!els['sb-search'].value);
    renderSidebar();
  });
  $('#sb-search-clear').onclick = function () { els['sb-search'].value = ''; $('#sb-search-wrap').classList.remove('has-val'); renderSidebar(); els['sb-search'].focus(); };
  els['sort-sel'].value = S.settings.sort;
  els['sort-sel'].onchange = function () { S.settings.sort = els['sort-sel'].value; renderSidebar(); saveNow(); };
  $('#btn-new').onclick = function () { newNote(''); };

  /* preview interactions */
  els['md-body'].addEventListener('click', function (ev) {
    var cb = ev.target.closest('input[data-task]');
    if (cb) { ev.preventDefault(); toggleTask(+cb.dataset.task); return; }
    var cp = ev.target.closest('[data-copy-code]');
    if (cp) { copyText(cp.closest('pre').querySelector('code').innerText, 'Code copied'); return; }
    var a = ev.target.closest('a[href^="#"]');
    if (a) {
      ev.preventDefault();
      var t = document.getElementById(a.getAttribute('href').slice(1));
      if (t) { syncLock = Date.now() + 400; t.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    }
  });

  /* top bar */
  $$('#view-seg .btn').forEach(function (b) { b.onclick = function () { setView(b.dataset.view); }; });
  $('#btn-sidebar').onclick = function () { setSetting('showSidebar', !S.settings.showSidebar); };
  $('#btn-theme').onclick = toggleTheme;
  $('#btn-settings').onclick = function () { openModal('scrim-settings'); buildSettings(); };
  $('#btn-find').onclick = function () { findState.on ? closeFind() : openFind(true); };
  $('#btn-palette').onclick = openPalette;
  $('#btn-help').onclick = function () { openModal('scrim-help'); };
  $('#btn-copy-md').onclick = function () { copyText(active().body || '', 'Markdown copied to clipboard'); };

  /* export menu */
  var menu = $('#export-menu');
  function closeMenu() { menu.classList.remove('on'); }
  $('#btn-export').onclick = function (ev) { ev.stopPropagation(); menu.classList.toggle('on'); };
  menu.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    closeMenu();
    ({
      md: exportMd, html: exportHtml, pdf: function () { window.print(); },
      cmd: function () { copyText(els['md-body'].innerHTML, 'Rendered HTML copied'); },
      backup: exportAll, import: function () { els['file-in'].click(); }
    })[b.dataset.act]();
  });
  document.addEventListener('click', function (ev) { if (!ev.target.closest('.menuwrap')) closeMenu(); });
  window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeMenu(); });

  /* mobile: sidebar overlay + backdrop */
  window.addEventListener('resize', debounce(applySettings, 120));
  $('#sb-backdrop').onclick = function () { setSetting('showSidebar', false); };

  /* find bar */
  els['find-in'].addEventListener('input', function () { findState.q = els['find-in'].value; runFind(); });
  els['find-in'].addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); gotoHit(ev.shiftKey ? -1 : 1); }
    if (ev.key === 'Escape') { ev.preventDefault(); closeFind(); }
  });
  els['rep-in'].addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); ev.shiftKey ? replaceAll() : replaceOne(); }
    if (ev.key === 'Escape') { ev.preventDefault(); closeFind(); }
  });
  $('#find-next').onclick = function () { gotoHit(1); };
  $('#find-prev').onclick = function () { gotoHit(-1); };
  $('#find-close').onclick = closeFind;
  $('#rep-one').onclick = replaceOne;
  $('#rep-all').onclick = replaceAll;
  [['find-case', 'case'], ['find-word', 'word'], ['find-re', 're']].forEach(function (p) {
    $('#' + p[0]).onclick = function () {
      findState[p[1]] = !findState[p[1]];
      $('#' + p[0]).classList.toggle('on', findState[p[1]]);
      runFind();
    };
  });

  /* palette */
  els['pal-in'].addEventListener('input', function () { palSel = 0; renderPalette(); });
  els['pal-in'].addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); renderPalette(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); palSel = Math.max(0, palSel - 1); renderPalette(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); runPalette(palSel); }
  });
  els['pal-list'].addEventListener('click', function (ev) {
    var r = ev.target.closest('[data-i]'); if (r) runPalette(+r.dataset.i);
  });
  els['pal-list'].addEventListener('mousemove', function (ev) {
    var r = ev.target.closest('[data-i]'); if (r && +r.dataset.i !== palSel) { palSel = +r.dataset.i; renderPalette(); }
  });

  /* settings */
  els['settings-body'].addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-toggle]'); if (!t) return;
    setSetting(t.dataset.toggle, !S.settings[t.dataset.toggle]);
  });
  els['settings-body'].addEventListener('change', function (ev) {
    var s = ev.target.closest('[data-set]'), n = ev.target.closest('[data-num]');
    if (s) setSetting(s.dataset.set, s.value);
    if (n) setSetting(n.dataset.num, Math.max(+n.min, Math.min(+n.max, +n.value || +n.defaultValue)));
  });
  $('#btn-export-all').onclick = exportAll;
  $('#btn-import-all').onclick = function () { els['json-in'].click(); };
  $('#btn-wipe').onclick = function () {
    if (!confirm('Delete every note and setting stored in this browser? This cannot be undone.\n\nExport a backup first if you want to keep anything.')) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    S.notes = []; S.trash = []; S.settings = Object.assign({}, DEFAULTS); seed();
    closeModals(); applySettings(); openNote(S.notes[0].id, false); saveNow(); toast('All data deleted');
  };

  /* modals */
  $$('.scrim').forEach(function (s) {
    s.addEventListener('mousedown', function (ev) { if (ev.target === s) closeModals(); });
  });
  $$('[data-close]').forEach(function (b) { b.onclick = closeModals; });

  /* files */
  els['file-in'].onchange = function () { importFiles(els['file-in'].files); els['file-in'].value = ''; };
  els['json-in'].onchange = function () { if (els['json-in'].files[0]) importBackup(els['json-in'].files[0]); els['json-in'].value = ''; };
  var dragDepth = 0;
  window.addEventListener('dragenter', function (ev) { ev.preventDefault(); if (++dragDepth === 1) els.dropzone.classList.add('on'); });
  window.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  window.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; els.dropzone.classList.remove('on'); } });
  window.addEventListener('drop', function (ev) {
    ev.preventDefault(); dragDepth = 0; els.dropzone.classList.remove('on');
    var fs = ev.dataTransfer && ev.dataTransfer.files;
    if (!fs || !fs.length) return;
    if (fs.length === 1 && /\.json$/i.test(fs[0].name)) { importBackup(fs[0]); return; }
    var texts = [], imgs = [];
    for (var i = 0; i < fs.length; i++) (/^image\//.test(fs[i].type) ? imgs : texts).push(fs[i]);
    imgs.forEach(embedImageFile);
    if (texts.length) importFiles(texts);
  });

  /* gutter resize */
  var dragging = false;
  els.gutter.addEventListener('mousedown', function (ev) {
    dragging = true; ev.preventDefault(); els.gutter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
  });
  window.addEventListener('mousemove', function (ev) {
    if (!dragging) return;
    var r = els.panes.getBoundingClientRect();
    var pct = window.innerWidth <= 900
      ? ((ev.clientY - r.top) / r.height) * 100
      : ((ev.clientX - r.left) / r.width) * 100;
    S.settings.splitRatio = Math.max(18, Math.min(82, pct));
    applySettings();
  });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false; els.gutter.classList.remove('dragging'); document.body.style.cursor = ''; saveNow();
  });
  els.gutter.addEventListener('dblclick', function () { S.settings.splitRatio = 50; applySettings(); saveNow(); });

  /* global keys */
  window.addEventListener('keydown', function (ev) {
    var mod = isMac ? ev.metaKey : ev.ctrlKey;
    var anyModal = $$('.scrim.on').length > 0;
    if (ev.key === 'Escape') {
      if (anyModal) { closeModals(); return; }
      if (findState.on) { closeFind(); return; }
    }
    if (mod && ev.key.toLowerCase() === 'k' && !ev.shiftKey) { ev.preventDefault(); openPalette(); return; }
    if (mod && ev.key === '/') { ev.preventDefault(); openModal('scrim-help'); return; }
    if (anyModal) return;
    if (mod && ev.key.toLowerCase() === 'f' && !ev.shiftKey) { ev.preventDefault(); openFind(true); return; }
    if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); saveNow(); exportMd(); return; }
    if (mod && ev.key === '\\') { ev.preventDefault(); setSetting('showSidebar', !S.settings.showSidebar); return; }
    if (mod && ev.shiftKey && ev.key.toLowerCase() === 'l') { ev.preventDefault(); toggleTheme(); return; }
    if (mod && (ev.key === '=' || ev.key === '+')) { ev.preventDefault(); setSetting('fontSize', Math.min(28, S.settings.fontSize + 1)); return; }
    if (mod && ev.key === '-') { ev.preventDefault(); setSetting('fontSize', Math.max(11, S.settings.fontSize - 1)); return; }
    if (mod && !ev.altKey && !ev.shiftKey && (ev.key === '1' || ev.key === '2' || ev.key === '3')) {
      ev.preventDefault(); setView({ '1': 'edit', '2': 'split', '3': 'prev' }[ev.key]); return;
    }
    if (ev.altKey && !mod && ev.key.toLowerCase() === 'n') { ev.preventDefault(); newNote(''); return; }
    if (ev.altKey && !mod && (ev.key === 'Backspace' || ev.key === 'Delete')) { ev.preventDefault(); deleteNote(S.activeId); return; }
    if (!mod) return;
    var k = ev.key.toLowerCase();
    if (ev.altKey && ['1', '2', '3', '4', '5', '6'].indexOf(ev.key) >= 0) { ev.preventDefault(); setHeading(+ev.key); return; }
    if (ev.shiftKey) {
      if (k === 'd') { ev.preventDefault(); duplicateLines(); return; }
      if (k === 'k') { ev.preventDefault(); deleteLines(); return; }
      if (ev.key === '*' || ev.key === '8') { ev.preventDefault(); toggleLinePrefix('- ', /^\s*[-*+]\s+/); return; }
      if (ev.key === '&' || ev.key === '7') { ev.preventDefault(); toggleOrdered(); return; }
      if (ev.key === '(' || ev.key === '9') { ev.preventDefault(); toggleLinePrefix('- [ ] ', /^\s*[-*+]\s+(\[[ xX]\]\s+)?/); return; }
      if (ev.key === '>' || ev.key === '.') { ev.preventDefault(); toggleLinePrefix('> ', /^\s*>\s?/); return; }
      return;
    }
    if (k === 'b') { ev.preventDefault(); wrapInline('**', '**', 'bold text'); }
    else if (k === 'i') { ev.preventDefault(); wrapInline('*', '*', 'italic text'); }
    else if (k === 'e') { ev.preventDefault(); wrapInline('`', '`', 'code'); }
    else if (k === 'l') { ev.preventDefault(); insertLink(); }
  });

  window.addEventListener('beforeunload', function () { saveNow(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function () {
      if (S.settings.theme === 'system') applySettings();
    });
  }
  /* keep other tabs in sync */
  window.addEventListener('storage', function (ev) {
    if (ev.key !== KEY || !ev.newValue) return;
    try {
      var d = JSON.parse(ev.newValue);
      if (!Array.isArray(d.notes)) return;
      S.notes = d.notes; S.trash = d.trash || [];
      if (!S.notes.some(function (n) { return n.id === S.activeId; })) S.activeId = S.notes[0] && S.notes[0].id;
      var n = active();
      if (n && document.activeElement !== els.editor) { els.editor.value = n.body || ''; renderPreview(); }
      renderSidebar(); updateStatus();
    } catch (e) { }
  });
}

/* ---------------- init ---------------- */
function init() {
  cacheEls();
  load();
  if (window.innerWidth <= 720 && !S.settings._mobileSeen) {
    S.settings.showSidebar = false;
    if (S.settings.view === 'split') S.settings.view = 'edit';
    S.settings._mobileSeen = true;
  }
  applySettings();
  buildToolbar();
  buildHelp();
  wire();
  var n = active();
  els.editor.value = n.body || '';
  els.editor.setSelectionRange(0, 0);
  els['doc-title'].value = n.title || '';
  els['doc-title'].placeholder = deriveTitle(n);
  renderSidebar(); renderPreview(); updateStatus(); setSaved(true);
  els.editor.focus();
  els.editor.scrollTop = 0; els.preview.scrollTop = 0;
  if (location.protocol === 'file:' || location.protocol === 'http:' || location.protocol === 'https:') {
    // nothing to fetch — fully offline by design
  }
}

/* ---------------- seed content (injected at build) ---------------- */
var WELCOME = "# Welcome to MarkdownPad\n\nA complete markdown notepad in **one HTML file**. No installer, no account, no internet — open the file and write. Everything you type is saved in this browser automatically.\n\n> Try editing this text on the left. The preview updates as you type.\n\n## What you can do\n\n- [x] Write markdown with a **live preview**\n- [x] Keep as many notes as you like in the sidebar\n- [ ] Try ticking this box — it writes back into the source\n- [ ] Press `Ctrl`/`⌘` + `K` for the command palette\n\n### Formatting\n\nEverything you'd expect: **bold**, *italic*, ~~strikethrough~~, `inline code`, ==highlighted text==, [links](https://example.com), and footnotes[^1].\n\n[^1]: Footnotes render at the bottom of the document, and the arrow takes you back.\n\n### Tables\n\n| Feature | Shortcut | Works offline |\n| --- | --- | --- |\n| Bold | `Ctrl/⌘ + B` | Yes |\n| Find & replace | `Ctrl/⌘ + F` | Yes |\n| Save as PDF | `Ctrl/⌘ + P` | Yes |\n\n### Code\n\n```js\n// syntax highlighting for ~50 languages, bundled in the file\nconst notes = load().filter(n => n.pinned);\nconsole.log(`${notes.length} pinned`);\n```\n\n## Getting your work out\n\n| Action | Where |\n| --- | --- |\n| Save this note as `.md` | `Ctrl`/`⌘` + `S` |\n| Export as a styled HTML file | Command palette → *Export note as HTML* |\n| Save as PDF | `Ctrl`/`⌘` + `P`, then choose **Save as PDF** |\n| Back up everything | Settings → *Export backup* |\n\nDrag `.md` files onto the window to import them.\n\n---\n\n## A few things worth knowing\n\n1. **Your notes live in this browser only.** Same file, same browser, same device — they'll be there. Clearing site data deletes them, so export a backup for anything important.\n2. **Nothing is ever sent anywhere.** There is no network code in this file at all.\n3. Type `#project` anywhere in a note to tag it — tags show up in the sidebar.\n\nPress `Ctrl`/`⌘` + `/` for the full shortcut list. Happy writing.\n";
var SCRATCH = "# Scratchpad\n\nQuick capture. Nothing here is precious.\n\n- [ ] \n";
var CHEATSHEET = "| Syntax | Result |\n| --- | --- |\n| `# H1` … `###### H6` | Headings |\n| `**bold**` `*italic*` | **bold** *italic* |\n| `~~strike~~` `==mark==` | ~~strike~~ ==mark== |\n| `` `code` `` | `code` |\n| ` ```lang ` … ` ``` ` | Fenced code block with highlighting |\n| `- item` / `1. item` | Bullet / numbered list |\n| `- [ ] todo` | Task list (clickable in preview) |\n| `> quote` | Blockquote |\n| `[text](url)` | Link |\n| `![alt](url)` | Image |\n| `---` | Horizontal rule |\n| `\\| a \\| b \\|` | Table |\n| `[^1]` and `[^1]: note` | Footnote |\n| `#tag` | Tags the note in the sidebar |\n| `---` … `---` at the top | YAML front matter card |\n";

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
